<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Time tracking dashboard</title>

    <link rel="stylesheet" href="./assets/styles/css/index.css" />
  </head>
  <body>
    <main>
      <section class="profile-card">
        <div class="profile-card__inner">
          <img
            src="./images/image-jeremy.png"
            alt="Profile picture of the user"
            srcset=""
          />
          <div class="profile-card__name">
            <p>Report for</p>
            <h1>Jeremy Robson</h1>
          </div>
        </div>
        <div class="profile-card__filters">
          <button aria-pressed="false" data-filter="daily" class="js-filter-btn">Daily</button>
          <button aria-pressed="true" data-filter="weekly" class="js-filter-btn active">Weekly</button>
          <button aria-pressed="false" data-filter="monthly" class="js-filter-btn">Monthly</button>
        </div>
      </section>

      <section class="js-filter-grid filter-grid">
      </section>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Haseeb Ahmed</a>.
    </footer>
    <script type="module" src="./assets/js/main.js"></script>
  </body>
</html>
